<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgWaterless" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B192C"/>
      <stop offset="100%" stop-color="#0F2C59"/>
    </linearGradient>
    <linearGradient id="shieldSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgWaterless)" rx="24"/>
  <rect x="12" y="12" width="776" height="576" fill="none" stroke="#CBD5E1" stroke-width="2" rx="18" opacity="0.4"/>

  <!-- Water Drop Shield Center Icon -->
  <g transform="translate(250, 100)">
    <!-- Shield Outline -->
    <path d="M 150 20 L 280 60 L 280 220 C 280 320 150 380 150 380 C 150 380 20 320 20 220 L 20 60 Z" fill="url(#shieldSilver)"/>
    <path d="M 150 40 L 260 75 L 260 215 C 260 300 150 350 150 350 C 150 350 40 300 40 215 L 40 75 Z" fill="#0F2C59"/>
    
    <!-- Eco Water Drop in Shield -->
    <path d="M 150 90 C 150 90 200 170 200 210 C 200 238 178 260 150 260 C 122 260 100 238 100 210 C 100 170 150 90 Z" fill="#38BDF8"/>
    
    <!-- Sparkle Stars -->
    <path d="M 220 120 L 225 135 L 240 140 L 225 145 L 220 160 L 215 145 L 200 140 L 215 135 Z" fill="#FFFFFF"/>
    <path d="M 80 240 L 83 250 L 93 253 L 83 256 L 80 266 L 77 256 L 67 253 L 77 250 Z" fill="#FFFFFF"/>
  </g>

  <!-- Eco Text Badge -->
  <rect x="250" y="500" width="300" height="50" rx="25" fill="#1D4ED8" stroke="#FFFFFF" stroke-width="2"/>
  <text x="400" y="532" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" fill="#FFFFFF" text-anchor="middle">100% ECO WATERLESS TECH</text>
</svg>
