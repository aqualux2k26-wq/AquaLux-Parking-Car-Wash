<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="heroDarkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B192C"/>
      <stop offset="40%" stop-color="#0F2C59"/>
      <stop offset="80%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0B192C"/>
    </linearGradient>
    <linearGradient id="silverChromeBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <filter id="heroGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#heroDarkGradient)"/>
  
  <!-- Architectural Garage Lines -->
  <g stroke="#CBD5E1" stroke-width="1" opacity="0.15">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>

  <!-- Blue & Silver Halo Spotlights -->
  <circle cx="950" cy="200" r="280" fill="#1D4ED8" opacity="0.3" filter="url(#heroGlow)"/>
  <circle cx="250" cy="500" r="220" fill="#38BDF8" opacity="0.2" filter="url(#heroGlow)"/>

  <!-- High Precision Sports Coupe Silhouette -->
  <g transform="translate(200, 150)">
    <path d="M 50 320 C 100 240, 220 150, 420 130 C 620 110, 780 180, 850 250 L 920 280 C 960 300, 970 340, 930 380 C 880 410, 150 410, 50 380 Z" fill="url(#silverChromeBg)" filter="url(#heroGlow)"/>
    <path d="M 280 160 C 380 140, 560 135, 680 170 C 740 190, 780 230, 800 260 L 290 260 Z" fill="#0F2C59" opacity="0.9"/>
    
    <!-- Chrome Wheels -->
    <circle cx="250" cy="380" r="70" fill="#0B192C" stroke="#FFFFFF" stroke-width="8"/>
    <circle cx="250" cy="380" r="48" fill="#1D4ED8" stroke="#CBD5E1" stroke-width="6"/>
    <circle cx="750" cy="380" r="70" fill="#0B192C" stroke="#FFFFFF" stroke-width="8"/>
    <circle cx="750" cy="380" r="48" fill="#1D4ED8" stroke="#CBD5E1" stroke-width="6"/>

    <!-- LED Tail & Headlight Highlights -->
    <path d="M 880 280 L 930 295 L 900 320 Z" fill="#38BDF8" filter="url(#heroGlow)"/>
    <path d="M 60 330 L 100 320 L 70 350 Z" fill="#FFFFFF" filter="url(#heroGlow)"/>
  </g>

  <!-- Executive Water Drop Badge Emblem -->
  <g transform="translate(900, 80)">
    <circle cx="80" cy="80" r="70" fill="#0F2C59" stroke="#CBD5E1" stroke-width="4"/>
    <path d="M 80 30 C 80 30 120 80 120 100 C 120 122 102 140 80 140 C 58 140 40 122 40 100 C 40 80 80 30 Z" fill="#38BDF8"/>
  </g>
</svg>
