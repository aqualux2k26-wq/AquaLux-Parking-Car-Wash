<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgValet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B192C"/>
      <stop offset="50%" stop-color="#0F2C59"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="silverKey" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgValet)" rx="24"/>
  <rect x="12" y="12" width="776" height="576" fill="none" stroke="#CBD5E1" stroke-width="2" rx="18" opacity="0.4"/>

  <!-- VIP Valet Podium & Key Emblem -->
  <g transform="translate(250, 120)">
    <!-- Podium Structure -->
    <rect x="75" y="150" width="150" height="220" rx="12" fill="#0B192C" stroke="#CBD5E1" stroke-width="4"/>
    <rect x="60" y="130" width="180" height="30" rx="8" fill="#1D4ED8" stroke="#FFFFFF" stroke-width="2"/>
    <text x="150" y="152" font-family="'Cinzel', serif" font-weight="700" font-size="16" fill="#FFFFFF" text-anchor="middle">AQUALUX VALET</text>

    <!-- Luxury Key Symbol -->
    <circle cx="150" cy="60" r="35" fill="none" stroke="url(#silverKey)" stroke-width="10"/>
    <circle cx="150" cy="60" r="18" fill="none" stroke="#38BDF8" stroke-width="6"/>
    <rect x="145" y="95" width="10" height="60" rx="4" fill="url(#silverKey)"/>
    <rect x="155" y="115" width="20" height="10" rx="2" fill="url(#silverKey)"/>
    <rect x="155" y="135" width="15" height="10" rx="2" fill="url(#silverKey)"/>
  </g>

  <!-- Stars & Crown -->
  <path d="M 400 400 L 415 425 L 440 430 L 420 450 L 425 475 L 400 460 L 375 475 L 380 450 L 360 430 L 385 425 Z" fill="#38BDF8"/>
  <path d="M 280 420 L 290 440 L 310 443 L 295 458 L 300 478 L 280 466 L 260 478 L 265 458 L 250 443 L 270 440 Z" fill="#CBD5E1"/>
  <path d="M 520 420 L 530 440 L 550 443 L 535 458 L 540 478 L 520 466 L 500 478 L 505 458 L 490 443 L 510 440 Z" fill="#CBD5E1"/>

  <!-- Valet Label -->
  <rect x="250" y="510" width="300" height="50" rx="25" fill="#0F2C59" stroke="#38BDF8" stroke-width="2"/>
  <text x="400" y="542" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" fill="#FFFFFF" text-anchor="middle">WHITE-GLOVE VALET PARKING</text>
</svg>
