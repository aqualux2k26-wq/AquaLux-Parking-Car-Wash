<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B192C"/>
      <stop offset="50%" stop-color="#0F2C59"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="silverGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#E2E8F0"/>
      <stop offset="70%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <filter id="silverGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield Circle -->
  <rect width="512" height="512" rx="128" fill="url(#blueGradient)"/>
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="url(#silverGradient)" stroke-width="6" opacity="0.8"/>

  <!-- Water Drop / Diamond Crown Crest -->
  <g transform="translate(156, 90)">
    <!-- Water drop combined with Luxury Crown -->
    <path d="M100 10 C100 10 180 120 180 180 C180 224 144 260 100 260 C56 260 20 224 20 180 C20 120 100 10 Z" fill="url(#silverGradient)" filter="url(#silverGlow)"/>
    <!-- Inner Sapphire Water Sparkle -->
    <path d="M100 35 C100 35 160 125 160 175 C160 208 133 235 100 235 C67 235 40 208 40 175 C40 125 100 35 Z" fill="#0F2C59"/>
    
    <!-- Sleek Car Silhouette Emblem inside Drop -->
    <path d="M55 170 C60 155 75 145 100 145 C125 145 140 155 145 170 L160 172 C165 172 168 176 168 180 L168 190 C168 195 164 198 160 198 L40 198 C36 198 32 195 32 190 L32 180 C32 176 35 172 40 172 Z" fill="url(#silverGradient)"/>
    <circle cx="65" cy="198" r="10" fill="#0B192C" stroke="url(#silverGradient)" stroke-width="3"/>
    <circle cx="135" cy="198" r="10" fill="#0B192C" stroke="url(#silverGradient)" stroke-width="3"/>
  </g>

  <!-- Brand Typography -->
  <text x="256" y="405" font-family="'Cinzel', 'Playfair Display', serif" font-weight="800" font-size="38" letter-spacing="4" fill="url(#silverGradient)" text-anchor="middle">AQUALUX</text>
  <text x="256" y="445" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="18" letter-spacing="6" fill="#94A3B8" text-anchor="middle">PARKING CAR WASH</text>
</svg>
